name: telegram-sales-intelligence

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4010/api/v1}
  restart: unless-stopped
  networks: [tsi]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tsi
      POSTGRES_USER: tsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsi_dev_password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsi -d tsi']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tsi]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tsi]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports: ['${MINIO_API_HOST_PORT:-9000}:9000', '${MINIO_CONSOLE_PORT:-9011}:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tsi]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    volumes:
      - ./docker/sample-report.html:/seed/sample-report.html:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/reports &&
      mc cp /seed/sample-report.html local/reports/organizations/10000000-0000-4000-8000-000000000001/reports/2026/07/11/10000000-0000-4000-8000-000000000013.html"
    restart: 'no'
    networks: [tsi]

  api:
    <<: *app-base
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed && pnpm --filter @tsi/api start']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tsi:${POSTGRES_PASSWORD:-tsi_dev_password}@postgres:5432/tsi?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-me-32-characters}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      API_PORT: 4000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_API_HOST_PORT:-9000}
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TELEGRAM_COLLECTOR_URL: http://telegram-collector:4100
      WORKFLOW_DEBOUNCE_SECONDS: 300
      WORKFLOW_MAX_DELAY_SECONDS: 300
    ports: ['${API_HOST_PORT:-4010}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4000/health']
      interval: 5s
      timeout: 4s
      retries: 30

  telegram-collector:
    <<: *app-base
    command: ['pnpm', '--filter', '@tsi/telegram-collector', 'start']
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app-base
    command: ['pnpm', '--filter', '@tsi/worker', 'start']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tsi:${POSTGRES_PASSWORD:-tsi_dev_password}@postgres:5432/tsi?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      OPENCLAW_WEBHOOK_URL: ${OPENCLAW_WEBHOOK_URL:-}
      OPENCLAW_WEBHOOK_TOKEN: ${OPENCLAW_WEBHOOK_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-secret-change-me-32-characters}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      api: { condition: service_healthy }

  mcp-server:
    <<: *app-base
    command: ['pnpm', '--filter', '@tsi/mcp-server', 'start']
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me}
      MCP_HTTP_PORT: 4200
      MCP_TRANSPORT: http
    ports: ['${MCP_HOST_PORT:-4200}:4200']
    depends_on:
      api: { condition: service_healthy }

  web:
    <<: *app-base
    command: ['pnpm', '--filter', '@tsi/web', 'start']
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4010/api/v1}
    ports: ['${WEB_HOST_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  tsi:
    driver: bridge
